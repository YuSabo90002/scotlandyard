name: 機能リクエスト
description: 新機能や改善を提案する
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        新機能や改善のアイデアを共有していただきありがとうございます。

  - type: textarea
    id: problem
    attributes:
      label: 解決したい問題
      description: この機能がどのような問題を解決しますか？
      placeholder: 〜ができなくて困っています...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 提案する解決策
      description: どのような機能があれば問題が解決しますか？
      placeholder: 〜という機能があれば...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 代替案
      description: 他に検討した解決策はありますか？
      placeholder: 〜も考えましたが...

  - type: textarea
    id: additional
    attributes:
      label: 追加情報
      description: その他の情報、参考資料、モックアップなど
      placeholder: 参考になるリンクや画像など
