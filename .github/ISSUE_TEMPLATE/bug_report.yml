name: バグレポート
description: バグや問題を報告する
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        バグを報告していただきありがとうございます。以下のフォームに記入してください。

  - type: textarea
    id: description
    attributes:
      label: バグの説明
      description: バグの内容を簡潔に説明してください
      placeholder: 何が起こりましたか？
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 再現手順
      description: バグを再現するための手順を記載してください
      placeholder: |
        1. '...'に移動
        2. '...'をクリック
        3. '...'まで下にスクロール
        4. エラーが表示される
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待される動作
      description: 本来どのような動作をすべきでしたか？
      placeholder: 何が起こるべきでしたか？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
      description: 実際に何が起こりましたか？
      placeholder: 実際に何が起こりましたか？
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: スクリーンショット
      description: 可能であれば、スクリーンショットを添付してください
      placeholder: スクリーンショットをドラッグ&ドロップ

  - type: dropdown
    id: browser
    attributes:
      label: ブラウザ
      description: 使用しているブラウザを選択してください
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - その他
    validations:
      required: true

  - type: input
    id: browser-version
    attributes:
      label: ブラウザバージョン
      description: ブラウザのバージョンを入力してください
      placeholder: 例：120.0.0.0

  - type: dropdown
    id: os
    attributes:
      label: OS
      description: 使用しているOSを選択してください
      options:
        - Windows
        - macOS
        - Linux
        - iOS
        - Android
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 追加情報
      description: その他の情報があれば記載してください
      placeholder: 関連する設定、コンソールエラーなど
